services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: messagingapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d messagingapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/messagingapp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: dev
      SPRING_SECURITY_LOG_LEVEL: INFO
      JWT_SECRET: 7132CE6EF35F2E76CBF9CBBAAF4F5FF2
      APP_COOKIE_SECURE: false
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../messagingAppUI
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
