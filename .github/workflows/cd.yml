name: Backend CD

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: xavbe/messaging-backend

jobs:
  system-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Xavbe/messagingAppUI
          path: messagingAppUI

      - name: Create system test compose file
        run: |
          cat > docker-compose.system-test.yml <<'EOF'
          services:
            db:
              image: postgres:16-alpine
              environment:
                POSTGRES_DB: messagingapp
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U postgres -d messagingapp"]
                interval: 5s
                timeout: 5s
                retries: 10

            backend:
              build:
                context: .
              environment:
                SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/messagingapp
                SPRING_DATASOURCE_USERNAME: postgres
                SPRING_DATASOURCE_PASSWORD: postgres
                SPRING_JPA_HIBERNATE_DDL_AUTO: update
                SPRING_PROFILES_ACTIVE: dev
                SPRING_SECURITY_LOG_LEVEL: INFO
                JWT_SECRET: 7132CE6EF35F2E76CBF9CBBAAF4F5FF2
                APP_COOKIE_SECURE: false
              depends_on:
                db:
                  condition: service_healthy

            frontend:
              build:
                context: ./messagingAppUI
              ports:
                - "3000:80"
              depends_on:
                - backend
          EOF

      - name: Start full stack
        run: docker compose -f docker-compose.system-test.yml up -d --build

      - name: Wait for frontend proxy
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.system-test.yml logs
          exit 1

      - name: Smoke test API through frontend
        run: |
          curl -fsS -c cookies.txt \
            -H "Content-Type: application/json" \
            -d '{"username":"test","password":"password123"}' \
            http://localhost:3000/api/login

          curl -fsS -b cookies.txt http://localhost:3000/api/me
          curl -fsS -b cookies.txt http://localhost:3000/api/conversations

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.system-test.yml logs

      - name: Stop full stack
        if: always()
        run: docker compose -f docker-compose.system-test.yml down -v

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: system-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:1.0
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
